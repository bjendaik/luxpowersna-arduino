name=LuxpowerTCP
version=1.0.0
author=Huu Bien
maintainer=Huu Bien
sentence=Arduino library for monitoring and controlling Luxpower SNA Pro inverters via local Wi-Fi TCP port 8000.
paragraph=A lightweight, standalone C++ library designed for ESP32. It communicates directly with the Luxpower Wi-Fi dongle over LAN TCP port 8000 to read realtime telemetry (PV, Battery, Grid, Load, Temp), cumulative energy (kWh), and write settings (charge/discharge limits) without cloud dependency.
